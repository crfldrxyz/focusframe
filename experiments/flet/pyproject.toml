[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focusframe-flet-experiment"
version = "0.1.0"
description = "Isolated Flet proof of concept for FocusFrame"
requires-python = ">=3.10"
dependencies = [
  "flet>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["main", "session_engine", "markdown_export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
