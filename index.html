<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fa"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="src/styles/tokens.css"><link rel="stylesheet" href="src/styles/app.css"><title>FocusFrame</title></head><body><main class="shell"><section class="card"><p class="eyebrow">FOCUSFRAME</p><h1>One thing. For now.</h1><p class="subtle">Choose one clear task, focus, then capture what happened.</p><form id="setup" class="stack"><label for="task">What will you focus on?</label><input id="task" maxlength="160" placeholder="e.g. Finish the first draft" required><label for="duration">Minutes</label><input id="duration" type="number" min="1" max="180" value="25"><button class="primary">Start focus</button></form><section id="focus" class="stack hidden" aria-live="polite"><p id="focus-task" class="task"></p><time id="timer" class="timer">25:00</time><p id="session-state" class="subtle"></p><div class="actions"><button id="pause" type="button">Pause</button><button id="finish" type="button">Finish early</button></div></section><section id="reflection" class="stack hidden"><h2>Session complete</h2><p id="completed-task" class="task"></p><label for="reflection-text">What did you notice?</label><textarea id="reflection-text" maxlength="2000" rows="6" placeholder="A few honest lines are enough."></textarea><div class="actions"><button id="save-reflection" class="primary" type="button">Save reflection</button><button id="copy" type="button">Copy Markdown</button><button id="download" type="button">Download Markdown</button></div><button id="new-session" class="text-button" type="button">Start another session</button></section></section></main><script type="module" src="src/app/app.js"></script></body></html>
