name: FocusFrame CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm test
      - run: npm run check
      - run: mkdir -p dist && cp index.html manifest.webmanifest sw.js dist/ && cp -r src dist/src
      - uses: actions/upload-artifact@v4
        with:
          name: focusframe-web
          path: dist/