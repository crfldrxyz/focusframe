name: Flet experiment

on:
  pull_request:
    paths:
      - "experiments/flet/**"
      - ".github/workflows/flet-experiment.yml"
  push:
    branches: [main]
    paths:
      - "experiments/flet/**"
      - ".github/workflows/flet-experiment.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/flet/pyproject.toml
      - run: python -m pip install -e ".[dev]"
        working-directory: experiments/flet
      - run: python -m pytest -q
        working-directory: experiments/flet
